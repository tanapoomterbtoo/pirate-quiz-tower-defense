name: Exam regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fallback:check
      - run: npx playwright install --with-deps chromium firefox webkit
      # Reviewed visual baselines are macOS-specific; functional checks run on Linux.
      - run: npx playwright test system.spec.cjs edge-cases.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/sampling-frequency.json
